<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Swish-test</title>
<style>
  :root { --bg: #f4f6fb; --card: #fff; --text: #0f1b3d; --muted: #5a6585; --line: #e1e6f2; --brand: #174297; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0a1230; --card: #121d44; --text: #eef1fa; --muted: #a9b3d2; --line: #26346a; --brand: #faeb1e; } }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 20px 16px 40px; }
  h1 { font-size: 24px; margin: 0 0 6px; }
  p { color: var(--muted); margin: 0 0 16px; }
  .t { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; margin-bottom: 12px; }
  .t b { display: block; margin-bottom: 8px; }
  .t a { display: block; text-align: center; padding: 12px; border-radius: 12px; border: 2px solid var(--brand); color: var(--text); font-weight: 700; text-decoration: none; }
  code { display: block; font-size: 11px; color: var(--muted); word-break: break-all; margin-top: 8px; }
</style>
</head>
<body>
<main>
  <h1>Swish-test</h1>
  <p>Tryck på knapparna en i taget. Notera vilka som öppnar Swish med nummer, belopp och meddelande ifyllt. Öppna sidan i Safari eller Chrome, inte inne i en annan app.</p>
  <div id="list"></div>
</main>
<script>
  var NR = "0730281822", AMT = 300, MSG = "Eskils 2019 försäljning 0001";
  var q = "sw=" + NR + "&amt=" + AMT + "&cur=SEK&msg=" + encodeURIComponent(MSG);
  function j(o) { return "swish://payment?data=" + encodeURIComponent(JSON.stringify(o)); }
  var tests = [
    ["A. Officiell länk (som QR-koder)", "https://app.swish.nu/1/p/sw/?" + q + "&src=qr"],
    ["B. Officiell länk utan src", "https://app.swish.nu/1/p/sw/?" + q],
    ["C. Android-variant av A", "intent://app.swish.nu/1/p/sw/?" + q + "&src=qr#Intent;scheme=https;package=se.bankgirot.swish;end"],
    ["D. swish:// med nummer som text", j({ version: 1, payee: { value: NR }, amount: { value: AMT }, message: { value: MSG } })],
    ["E. swish:// med låsta fält", j({ version: 1, payee: { value: NR, editable: false }, amount: { value: AMT, editable: false }, message: { value: MSG, editable: false } })],
    ["F. Formatet du fick (v/pa/msg, utan belopp)", j({ v: 1, pa: NR, msg: "Eskilsminne P2019" })]
  ];
  var list = document.getElementById("list");
  tests.forEach(function (t) {
    var d = document.createElement("div"); d.className = "t";
    var b = document.createElement("b"); b.textContent = t[0];
    var a = document.createElement("a"); a.href = t[1]; a.textContent = "Testa " + t[0].charAt(0);
    var c = document.createElement("code"); c.textContent = t[1];
    d.appendChild(b); d.appendChild(a); d.appendChild(c); list.appendChild(d);
  });
</script>
</body>
</html>
