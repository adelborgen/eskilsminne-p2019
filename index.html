<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#174297">
<title>Chokladförsäljning</title>
<style>
  /* Färger: Eskilsminne IF blå #174297 (accent) och gul #faeb1e (markering).
     Bekräfta mot klubbens grafiska profil. */
  :root {
    --bg: #f4f6fb; --card: #ffffff; --text: #0f1b3d; --muted: #5a6585;
    --line: #e1e6f2; --soft: #eaeffb;
    --brand: #174297; --yellow: #faeb1e; --navy: #0f1b3d;
    --accent: #174297;
    --cta-bg: #174297; --cta-ink: #ffffff; --sel-border: #174297;
    --ok: #1b7a34; --err: #b3261e;
    --shadow: 0 1px 2px rgba(15,27,61,.06), 0 6px 20px rgba(15,27,61,.06);
    --r: 20px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0a1230; --card: #121d44; --text: #eef1fa; --muted: #a9b3d2;
      --line: #26346a; --soft: #1a2857; --accent: #faeb1e;
      --cta-bg: #faeb1e; --cta-ink: #0f1b3d; --sel-border: #faeb1e;
      --ok: #7bd88f; --err: #ff9a92; --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font-size: 16px; line-height: 1.5;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .num { font-variant-numeric: tabular-nums; }

  .topbar { background: var(--brand); color: #fff; padding: calc(env(safe-area-inset-top, 0px) + 14px) 16px 18px; }
  .topbar-in { max-width: 560px; margin: 0 auto; display: flex; align-items: center; gap: 12px; }
  .topbar img { height: 36px; width: auto; }
  .pill { display: inline-block; background: var(--yellow); color: var(--navy); font-weight: 800; letter-spacing: .05em; padding: 3px 12px; border-radius: 999px; font-size: 14px; }
  .brandline { line-height: 1.2; }
  .club { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; opacity: .85; font-weight: 600; }
  .appname { font-size: 20px; font-weight: 800; }

  .tabs { display: flex; gap: 6px; background: var(--soft); padding: 4px; border-radius: 14px; }
  .tabs button { flex: 1; border: 0; background: transparent; color: var(--muted); font: inherit; font-weight: 700; padding: 10px 8px; border-radius: 10px; cursor: pointer; min-height: 46px; }
  .tabs button[aria-selected="true"] { background: var(--card); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.15); }
  details { border-top: 1px solid var(--line); }
  details:first-of-type { border-top: 0; }
  summary { cursor: pointer; font-weight: 700; padding: 14px 0; list-style: none; display: flex; justify-content: space-between; gap: 12px; min-height: 48px; }
  summary::-webkit-details-marker { display: none; }
  summary::after { content: "+"; font-size: 22px; line-height: 1; color: var(--muted); }
  details[open] summary::after { content: "–"; }
  details p { margin: 0 0 14px; }
  .page { max-width: 560px; margin: 0 auto; padding: 20px 16px calc(env(safe-area-inset-bottom, 0px) + 40px); }
  .page > * + * { margin-top: 16px; }
  h2.title { font-size: 26px; line-height: 1.2; margin: 4px 0 0; }
  .lead { color: var(--muted); margin: 6px 0 0; }
  .card { background: var(--card); border-radius: var(--r); padding: 20px; box-shadow: var(--shadow); border: 1px solid var(--line); }
  @media (prefers-color-scheme: light) { .card { border-color: transparent; } }
  .notice { background: var(--soft); border-left: 4px solid var(--yellow); border-radius: 10px; padding: 10px 14px; font-size: 14px; }

  /* ---------- Mätare ---------- */
  .meters { background: var(--brand); color: #fff; border: 0; display: grid; gap: 22px; }
  .kicker { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; opacity: .85; font-weight: 700; margin: 0; }
  .m-head { display: block; }
  .m-label { display: block; font-weight: 700; opacity: .92; }
  .m-value { font-size: 30px; font-weight: 800; line-height: 1.1; }
  .m-value small { font-size: 14px; font-weight: 600; opacity: .85; }
  .track-wrap { position: relative; padding-top: 22px; margin-top: 4px; }
  .track { height: 12px; border-radius: 999px; background: rgba(255,255,255,.25); overflow: hidden; }
  .track > span { display: block; height: 100%; background: var(--yellow); border-radius: 999px; transition: width .5s ease; }
  .marker { position: absolute; top: 0; bottom: -4px; width: 0; border-left: 2px solid #fff; }
  .marker span { position: absolute; top: -2px; left: 0; transform: translateX(-50%); font-size: 12px; font-weight: 700; white-space: nowrap; background: var(--brand); padding: 0 4px; }
  .m-cap { margin: 8px 0 0; font-size: 14px; opacity: .92; }
  .m-cap strong { color: var(--yellow); }

  /* ---------- Formulär ---------- */
  label, .label { display: block; font-weight: 700; margin: 0 0 6px; font-size: 15px; }
  .hint { font-weight: 400; color: var(--muted); font-size: 13px; display: block; margin-top: 2px; }
  input[type=text], input[type=tel], input[type=number] { width: 100%; font: inherit; color: var(--text); background: var(--bg);
    border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; min-height: 50px; }
  input:focus, button:focus-visible, a:focus-visible, summary:focus-visible { outline: 3px solid var(--sel-border); outline-offset: 2px; }
  .field + .field { margin-top: 16px; }
  .error { color: var(--err); font-size: 14px; margin: 6px 0 0; min-height: 1em; }
  .formerror { color: var(--err); font-weight: 700; margin: 0 0 12px; }
  .hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
  .check { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; color: var(--muted); font-weight: 400; }
  .check input { width: 22px; height: 22px; margin-top: 2px; flex-shrink: 0; accent-color: var(--brand); }

  .product { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
  .ico { flex: 0 0 48px; height: 48px; border-radius: 12px; background: var(--soft); display: grid; place-items: center; font-size: 26px; }
  .product .name { font-weight: 700; }
  .product .meta { font-size: 13px; color: var(--muted); }
  .stepper { display: flex; align-items: center; justify-content: center; gap: 10px; }
  .stepper button { width: 56px; height: 56px; border-radius: 14px; border: 1px solid var(--line); background: var(--soft); color: var(--text); font-size: 26px; font-weight: 700; cursor: pointer; }
  .stepper input { width: 96px; text-align: center; min-height: 56px; font-size: 26px; font-weight: 800; -moz-appearance: textfield; }
  .stepper input::-webkit-outer-spin-button, .stepper input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .presets { display: flex; gap: 8px; justify-content: center; margin-top: 12px; }
  .preset { min-width: 56px; min-height: 44px; border-radius: 12px; border: 2px solid var(--line); background: transparent; color: var(--text); font: inherit; font-weight: 800; cursor: pointer; }
  .preset[aria-pressed="true"] { border-color: var(--sel-border); background: var(--soft); }

  .pay { background: var(--soft); border-radius: 14px; padding: 14px 16px; margin-top: 16px; }
  .pay p { margin: 0; }
  .pay .big { font-size: 22px; font-weight: 800; }
  .pay .sub { color: var(--muted); font-size: 14px; margin-top: 2px; }
  .pay .sub strong { color: var(--text); }

  .primary { display: block; width: 100%; text-align: center; text-decoration: none; border: 0; border-radius: 14px; background: var(--cta-bg); color: var(--cta-ink);
    font: inherit; font-weight: 800; font-size: 17px; padding: 14px; cursor: pointer; min-height: 54px; }
  .primary[disabled] { opacity: .6; cursor: wait; }
  .ghost { width: 100%; border: 2px solid var(--line); border-radius: 14px; background: transparent; color: var(--text); font: inherit; font-weight: 700; padding: 12px; cursor: pointer; min-height: 48px; }

  /* ---------- Bekräftelse ---------- */
  .done h2 { margin: 0 0 4px; font-size: 24px; }
  .okline { color: var(--ok); font-weight: 800; margin: 0 0 4px; }
  .sumrow { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); margin: 14px 0; font-weight: 700; }
  .swish { border: 2px solid var(--yellow); border-radius: 16px; padding: 16px; }
  .swish h3 { margin: 0 0 4px; font-size: 20px; }
  .copyrow { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
  .copyrow:first-of-type { border-top: 0; }
  .copyrow .k { font-size: 12px; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; font-weight: 700; }
  .copyrow .v { font-size: 20px; font-weight: 800; word-break: break-word; }
  .copy { flex-shrink: 0; min-width: 84px; min-height: 44px; border-radius: 12px; border: 2px solid var(--line); background: transparent; color: var(--text); font: inherit; font-weight: 700; cursor: pointer; }
  .copy.ok { border-color: var(--ok); color: var(--ok); }
  .steps { margin: 14px 0 0; padding-left: 20px; }
  .steps li + li { margin-top: 4px; }
  .small { font-size: 14px; color: var(--muted); }
  .foot { text-align: center; font-size: 12px; color: var(--muted); margin-top: 28px; }
  .foot strong { color: var(--text); }
  .loading { text-align: center; color: var(--muted); padding: 24px 0; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-in">
    <img id="logo" alt="" hidden>
    <span class="pill" id="pill"></span>
    <div class="brandline"><div class="club" id="club"></div><div class="appname" id="apptitle"></div></div>
  </div>
</header>

<main class="page">
  <div class="tabs" role="tablist" aria-label="Sidor">
    <button role="tab" id="tab-bestall" aria-controls="view-bestall" aria-selected="true">Beställ</button>
    <button role="tab" id="tab-fragor" aria-controls="view-fragor" aria-selected="false">Vanliga frågor</button>
  </div>
  <section id="view-bestall" role="tabpanel" aria-labelledby="tab-bestall">
    <section id="meters" aria-label="Läget just nu"></section>
    <section id="content"></section>
  </section>
  <section id="view-fragor" role="tabpanel" aria-labelledby="tab-fragor" hidden></section>
  <div class="foot" id="foot"></div>
  <noscript>Sidan kräver JavaScript för att kunna ta emot beställningar.</noscript>
</main>

<script>
/* ==========================================================================
   KONFIGURATION: ändra bara här. Texterna visas som ren text (ingen HTML).
   ========================================================================== */
const CONFIG = {
  klubb: "Eskilsminne IF",
  lag: "P2019",                       // måste finnas i ALLOWED_LAG i Code.gs
  motto: "Respekt – Kamratskap – Jämlikhet",
  titel: "Eskilsminne försäljning",
  undertitel: "Lagkassan",

  // Webbadressen till Apps Script (se README.md). Tom = förhandsvisning med exempeldata.
  endpoint: "https://script.google.com/macros/s/AKfycbynyAJdsBp7DcwXx9NW-71FmZ307DfTU77ZgN47myDU99d4_BjrPfMzxWVSpmZs5DMhxA/exec",
  // Valfri logga: lägg filen bredvid index.html, till exempel "logga.png". Fråga klubben först.
  logo: "",

  produkt: { namn: "Marabou Klubbkaka", detalj: "Mjölkchoklad 90 g med klubbens logga", emoji: "🍫" },
  pris: 30,            // kr per kaka som föräldern swishar
  inkopspris: 14.5,    // kr per kaka vi betalar Marabou (inkl. tryck, frakt, moms). Kontrollera mot offerten.
  minimum: 240,        // minst så många behövs för att vi ska kunna beställa
  mal: 300,            // mätarens slut. Allt över är bonus.
  maxAntal: 50,        // största antal per beställning
  snabbval: [5, 10, 15, 20],

  // Swish. nummer = mottagaren. meddelande = text som förifylls, följd av ordernumret.
  swish: { nummer: "073 028 18 22", namnPaKonto: "Andreas Adelborg", meddelande: "Eskils 2019 försäljning" },

  intro: "Beställ klubbens chokladkaka med logga. Pengarna går till cuper, aktiviteter och annat som förgyller barnens vardag i laget. " +
         "Målet är minst 10 kakor per barn.",
  aterbetalning: "Kan vi av något skäl inte genomföra beställningen betalar vi tillbaka din Swish. Läs mer under Vanliga frågor.",
  belonning: "Beställs {mal} kakor eller fler blir det en överraskning för barnen på sista träningen före jul.",
  utlamning: "Information om när och var kakorna delas ut kommer inom kort.",
  kontakt: "Hittar du inte svaret? Skriv i lagets WhatsApp-grupp.",

  // Vanliga frågor. {pris}, {mal} och {minimum} fylls i automatiskt.
  faq: [
    { f: "Vad går pengarna till?",
      s: "Pengarna ska vara en grund för cuper, aktiviteter och annat som kan förgylla barnens vardag i P2019-laget." },
    { f: "Varför just de här kakorna?",
      s: "En stor andel av priset går tillbaka till laget. Eftersom kakan har klubbens logga sprider den dessutom föreningens namn." },
    { f: "Vad kostar det och hur betalar jag?",
      s: "{pris} per kaka. Du swishar direkt när du har beställt. Efter beställningen visas Swish-nummer, belopp och ett meddelande att skriva, så att vi hittar din betalning." },
    { f: "Hur många ska vi sälja?",
      s: "Målet är minst 10 kakor per barn. Några säljer fler och några färre, men tillsammans blir det ett bra tillskott till laget. Beställ det du tror att du kan sälja, eftersom leverantören inte tar tillbaka osålda kakor. Börja gärna med familj, släkt och grannar." },
    { f: "Vad händer om vi når {mal} kakor?",
      s: "Beställs {mal} kakor eller fler blir det en överraskning för barnen på sista träningen före jul. Allt över {mal} är bonus till lagkassan." },
    { f: "Vad händer om det inte blir tillräckligt många beställningar?",
      s: "Vi beställer från leverantören först när vi har minst {minimum} kakor beställda. Om vi inte når dit kan vi inte lägga beställningen, och då betalar vi tillbaka din Swish." },
    { f: "När och var får jag kakorna?",
      s: "Utlämning meddelas i lagets WhatsApp-grupp när kakorna är på plats." },
    { f: "Hur länge håller chokladen?",
      s: "Bäst före-datumet står på förpackningen. Sälj kakorna i god tid före det." },
    { f: "Kan jag ändra eller komplettera min beställning?",
      s: "Ja, gör en ny beställning eller hör av dig i lagets WhatsApp-grupp." },
    { f: "Vad sparar ni om mig?",
      s: "Vi sparar barnets förnamn och ditt mobilnummer, enbart för att hantera beställningen, utlämningen och betalningen. Uppgifterna delas inte vidare. Kontakta laget om du vill ha dem raderade." }
  ],

  // Exempeldata i förhandsvisningen (när endpoint är tom)
  demoBestallt: 187,
  demoSwish: "123 456 78 90"
};
/* ========================================================================== */

(function () {
  "use strict";

  var loadedAt = Date.now();
  var state = { bestallt: null, antal: 0, barn: "", mobil: "" };
  var demo = !CONFIG.endpoint;
  var marginal = CONFIG.pris - CONFIG.inkopspris;
  function fill(s) {
    return String(s).replace(/\{mal\}/g, new Intl.NumberFormat("sv-SE").format(CONFIG.mal))
      .replace(/\{minimum\}/g, new Intl.NumberFormat("sv-SE").format(CONFIG.minimum))
      .replace(/\{pris\}/g, CONFIG.pris + " kr");
  }

  function kr(n) {
    var whole = Math.abs(n - Math.round(n)) < 0.005;
    return new Intl.NumberFormat("sv-SE", { minimumFractionDigits: whole ? 0 : 2, maximumFractionDigits: whole ? 0 : 2 }).format(n) + " kr";
  }
  var nf = new Intl.NumberFormat("sv-SE");

  function h(tag, attrs) {
    var e = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function (k) {
      if (k === "text") e.textContent = attrs[k];
      else if (k === "class") e.className = attrs[k];
      else if (k.indexOf("on") === 0) e.addEventListener(k.slice(2), attrs[k]);
      else e.setAttribute(k, attrs[k]);
    });
    for (var i = 2; i < arguments.length; i++) {
      var kid = arguments[i];
      if (kid == null) continue;
      e.appendChild(typeof kid === "string" ? document.createTextNode(kid) : kid);
    }
    return e;
  }

  /* ---------- Topbar och sidfot ---------- */
  document.getElementById("pill").textContent = CONFIG.lag;
  document.getElementById("club").textContent = CONFIG.undertitel;
  document.getElementById("apptitle").textContent = CONFIG.titel;
  document.title = CONFIG.titel + " – " + CONFIG.lag;
  if (CONFIG.logo) { var lg = document.getElementById("logo"); lg.src = CONFIG.logo; lg.alt = CONFIG.klubb; lg.hidden = false; }
  var foot = document.getElementById("foot");
  foot.appendChild(h("strong", { text: CONFIG.klubb }));
  if (CONFIG.motto) foot.appendChild(h("div", { text: CONFIG.motto }));

  var metersBox = document.getElementById("meters");
  var content = document.getElementById("content");

  /* ---------- Mätare ---------- */
  function pct(v, max) { return max > 0 ? Math.max(0, Math.min(100, v / max * 100)) : 0; }

  function meter(o) {
    var fill = h("span"); fill.style.width = pct(o.value, o.max) + "%";
    var track = h("div", { class: "track", role: "progressbar", "aria-label": o.aria, "aria-valuemin": "0",
      "aria-valuemax": String(o.max), "aria-valuenow": String(Math.min(o.value, o.max)) }, fill);
    var wrap = h("div", { class: "track-wrap" }, track);
    if (o.markerAt != null) {
      var mk = h("div", { class: "marker" });
      mk.style.left = pct(o.markerAt, o.max) + "%";
      if (o.markerLabel) mk.appendChild(h("span", { text: o.markerLabel }));
      wrap.appendChild(mk);
    }
    var cap = h("p", { class: "m-cap" });
    o.cap.forEach(function (part) { cap.appendChild(typeof part === "string" ? document.createTextNode(part) : h("strong", { text: part.b })); });
    return h("div", null,
      h("div", { class: "m-head" }, h("span", { class: "m-label", text: o.label }),
        h("span", { class: "m-value num" }, o.big, h("small", { text: " " + o.small }))),
      wrap, cap);
  }

  function renderMeters() {
    metersBox.textContent = "";
    var n = state.bestallt;
    if (n == null) return;
    var mal = CONFIG.mal, cap1, reward = fill(CONFIG.belonning);
    if (n < mal) cap1 = [{ b: nf.format(mal - n) + " kvar till " + nf.format(mal) + ". " }, reward];
    else cap1 = [{ b: "Målet nått! " }, "Det blir en överraskning för barnen på sista träningen före jul." + (n > mal ? " Allt över " + nf.format(mal) + " är bonus: +" + nf.format(n - mal) + " kakor." : "")];

    var card = h("div", { class: "card meters" }, h("p", { class: "kicker", text: "Hela laget just nu" }),
      meter({ label: "Beställt", big: nf.format(n), small: "av " + nf.format(mal) + " kakor", value: n, max: mal,
        aria: "Beställda kakor", cap: cap1 }),
      meter({ label: "Direkt till lagkassan", big: kr(n * marginal), small: "hittills", value: n * marginal, max: mal * marginal,
        aria: "Pengar till lagkassan",
        cap: [{ b: kr(marginal) }, " av varje kaka går direkt till lagkassan. Vid " + nf.format(mal) + " kakor blir det " + kr(mal * marginal) + "."] }));
    metersBox.appendChild(card);
  }

  function loadStatus() {
    if (demo) { state.bestallt = CONFIG.demoBestallt; renderMeters(); return; }
    fetch(CONFIG.endpoint + "?action=status&lag=" + encodeURIComponent(CONFIG.lag))
      .then(function (r) { return r.json(); })
      .then(function (d) { if (d && d.ok && typeof d.bestallt === "number") { state.bestallt = d.bestallt; renderMeters(); } })
      .catch(function () { /* mätarna döljs, formuläret fungerar ändå */ });
  }

  /* ---------- Formulär ---------- */
  function renderForm() {
    content.textContent = "";
    if (demo) content.appendChild(h("p", { class: "notice", text: "Förhandsvisning med exempeldata. Beställningar skickas inte förrän sidan är kopplad till Apps Script." }));
    content.appendChild(h("div", { style: "margin-top:16px" }, h("h2", { class: "title", text: "Beställ" }), h("p", { class: "lead", text: CONFIG.intro })));

    var errBox = h("p", { class: "formerror", role: "alert", hidden: "" });
    var form = h("form", { class: "card", novalidate: "", autocomplete: "off", style: "margin-top:16px" }, errBox);

    var barn = h("input", { type: "text", id: "barn", name: "barn", maxlength: "40", autocomplete: "off", autocapitalize: "words", placeholder: "Förnamn", value: state.barn });
    barn.addEventListener("input", function () { state.barn = barn.value; });
    form.appendChild(h("div", { class: "field" },
      h("label", { for: "barn" }, "Barnets namn", h("span", { class: "hint", text: "Förnamn räcker. Lägg till efternamnets första bokstav om flera heter likadant." })),
      barn, h("p", { class: "error", id: "err-barn" })));

    var mobil = h("input", { type: "tel", id: "mobil", name: "mobil", inputmode: "tel", autocomplete: "tel", placeholder: "07x xxx xx xx", maxlength: "20", value: state.mobil });
    mobil.addEventListener("input", function () { state.mobil = mobil.value; });
    form.appendChild(h("div", { class: "field" },
      h("label", { for: "mobil" }, "Ditt mobilnummer", h("span", { class: "hint", text: "Så att vi kan nå dig om utlämning och betalning." })),
      mobil, h("p", { class: "error", id: "err-mobil" })));

    // Antal
    var P = CONFIG.produkt;
    var antalInp = h("input", { type: "number", inputmode: "numeric", id: "antal", min: "0", max: String(CONFIG.maxAntal), value: String(state.antal), "aria-label": "Antal kakor" });
    var payBig = h("p", { class: "big num" }), paySub = h("p", { class: "sub" });
    var presetBtns = [];
    function setAntal(v) {
      state.antal = Math.max(0, Math.min(CONFIG.maxAntal, v | 0));
      antalInp.value = String(state.antal);
      presetBtns.forEach(function (b) { b.btn.setAttribute("aria-pressed", String(b.n === state.antal)); });
      if (state.antal === 0) { payBig.textContent = "Välj antal kakor"; paySub.textContent = ""; }
      else {
        payBig.textContent = "Du swishar " + kr(state.antal * CONFIG.pris);
        paySub.textContent = "";
        paySub.appendChild(h("strong", { text: kr(state.antal * marginal) })); paySub.appendChild(document.createTextNode(" av det går direkt till lagkassan."));
      }
    }
    antalInp.addEventListener("change", function () { setAntal(parseInt(antalInp.value, 10) || 0); });

    var presets = h("div", { class: "presets", role: "group", "aria-label": "Snabbval" });
    CONFIG.snabbval.forEach(function (n) {
      var btn = h("button", { type: "button", class: "preset num", text: String(n), "aria-pressed": "false", onclick: function () { setAntal(n); } });
      presetBtns.push({ n: n, btn: btn }); presets.appendChild(btn);
    });

    form.appendChild(h("div", { class: "field" },
      h("span", { class: "label", text: "Hur många kakor?" }),
      h("div", { class: "product" }, h("div", { class: "ico", "aria-hidden": "true", text: P.emoji }),
        h("div", null, h("div", { class: "name", text: P.namn }), h("div", { class: "meta", text: P.detalj + " · " + kr(CONFIG.pris) + "/st" }))),
      h("div", { class: "stepper" },
        h("button", { type: "button", "aria-label": "Minska antal", text: "−", onclick: function () { setAntal(state.antal - 1); } }), antalInp,
        h("button", { type: "button", "aria-label": "Öka antal", text: "+", onclick: function () { setAntal(state.antal + 1); } })),
      presets,
      h("div", { class: "pay", "aria-live": "polite" }, payBig, paySub),
      h("p", { class: "error", id: "err-antal" })));
    setAntal(state.antal);

    var hp = h("input", { type: "text", name: "website", tabindex: "-1", autocomplete: "off", "aria-hidden": "true" });
    form.appendChild(h("div", { class: "hp", "aria-hidden": "true" }, h("label", { text: "Lämna tomt" }), hp));

    var samtycke = h("input", { type: "checkbox", id: "samtycke" });
    form.appendChild(h("div", { class: "field" },
      h("label", { class: "check", for: "samtycke" }, samtycke,
        h("span", { text: "Jag godkänner att barnets förnamn och mitt mobilnummer sparas av laget för att hantera beställningen." })),
      h("p", { class: "error", id: "err-samtycke" })));

    var submit = h("button", { type: "submit", class: "primary", text: "Beställ och gå vidare till Swish" });
    form.appendChild(submit);
    form.appendChild(h("p", { class: "small", style: "margin:12px 0 0", text: CONFIG.aterbetalning }));
    content.appendChild(form);

    function setErr(id, msg) { var e = document.getElementById(id); if (e) e.textContent = msg || ""; }
    function normalizeMobil(s) {
      s = String(s || "").replace(/[\s\-().]/g, "");
      if (s.indexOf("+46") === 0) s = "0" + s.slice(3); else if (s.indexOf("0046") === 0) s = "0" + s.slice(4);
      return s;
    }

    form.addEventListener("submit", function (ev) {
      ev.preventDefault();
      ["barn", "mobil", "antal", "samtycke"].forEach(function (k) { setErr("err-" + k); });
      errBox.hidden = true;
      var ok = true;
      var namn = barn.value.trim();
      if (!/^[\p{L}][\p{L} '\-.]{1,39}$/u.test(namn)) { setErr("err-barn", "Skriv barnets namn (2–40 tecken)."); ok = false; }
      var tel = normalizeMobil(mobil.value);
      if (!/^07\d{8}$/.test(tel)) { setErr("err-mobil", "Skriv ett svenskt mobilnummer, till exempel 070 123 45 67."); ok = false; }
      if (state.antal < 1) { setErr("err-antal", "Välj hur många kakor du vill beställa."); ok = false; }
      if (!samtycke.checked) { setErr("err-samtycke", "Du behöver godkänna för att kunna beställa."); ok = false; }
      if (!ok) { var f = form.querySelector(".error:not(:empty)"); if (f) f.scrollIntoView({ block: "center", behavior: "smooth" }); return; }

      var payload = { lag: CONFIG.lag, barn: namn, mobil: tel, antal: state.antal, samtycke: true, website: hp.value, t: Date.now() - loadedAt };
      submit.disabled = true; submit.textContent = "Skickar…";
      function fail(msg) {
        submit.disabled = false; submit.textContent = "Beställ och gå vidare till Swish";
        errBox.textContent = msg; errBox.hidden = false; errBox.scrollIntoView({ block: "center", behavior: "smooth" });
      }
      if (demo) { setTimeout(function () { success(payload, "DEMO0001", payload.antal * CONFIG.pris); }, 400); return; }
      fetch(CONFIG.endpoint, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(payload) })
        .then(function (r) { return r.json(); })
        .then(function (d) {
          if (d && d.ok) success(payload, d.id, typeof d.belopp === "number" ? d.belopp : payload.antal * CONFIG.pris);
          else fail((d && d.fel) || "Något gick fel. Försök igen.");
        })
        .catch(function () { fail("Det gick inte att skicka just nu. Kontrollera uppkopplingen och försök igen, eller hör av dig i WhatsApp-gruppen."); });
    });
  }

  function success(p, orderId, belopp) {
    if (typeof state.bestallt === "number") state.bestallt += p.antal;
    renderMeters();
    renderDone(p, orderId, belopp);
  }

  /* ---------- Bekräftelse med Swish-instruktioner ---------- */
  function copyText(text, btn) {
    function flash() { var old = btn.textContent; btn.textContent = "Kopierat ✓"; btn.classList.add("ok"); setTimeout(function () { btn.textContent = old; btn.classList.remove("ok"); }, 1600); }
    if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(text).then(flash, fallback); } else fallback();
    function fallback() {
      var t = h("textarea", { style: "position:fixed;opacity:0" }); t.value = text; document.body.appendChild(t); t.select();
      try { document.execCommand("copy"); flash(); } catch (e) {} document.body.removeChild(t);
    }
  }

  function renderDone(p, orderId, belopp) {
    content.textContent = "";
    var nummer = CONFIG.swish.nummer || (demo ? CONFIG.demoSwish : "");
    var meddelande = (CONFIG.swish.meddelande + " " + orderId).slice(0, 50);

    var swish = h("div", { class: "swish" }, h("h3", { text: "Swisha " + kr(belopp) + " nu" }));
    if (nummer) {
      function row(k, v, raw) {
        var b = h("button", { type: "button", class: "copy", text: "Kopiera", "aria-label": "Kopiera " + k.toLowerCase() });
        b.addEventListener("click", function () { copyText(raw || v, b); });
        return h("div", { class: "copyrow" }, h("div", null, h("div", { class: "k", text: k }), h("div", { class: "v num", text: v })), b);
      }
      swish.appendChild(row("Swish-nummer", nummer, String(nummer).replace(/\s/g, "")));
      if (CONFIG.swish.namnPaKonto) swish.appendChild(h("p", { class: "small", style: "margin:0 0 6px", text: "Mottagare: " + CONFIG.swish.namnPaKonto }));
      swish.appendChild(row("Belopp", kr(belopp), String(belopp)));
      swish.appendChild(row("Meddelande", meddelande, meddelande));
      swish.appendChild(h("ol", { class: "steps small" },
        h("li", { text: "Öppna Swish och fyll i numret, beloppet och meddelandet ovan. Tryck Kopiera för att slippa skriva." }),
        h("li", { text: "Behåll meddelandet. Det är så vi hittar din betalning." }),
        h("li", { text: "Klart! Du behöver inte göra något mer." })));
    } else {
      swish.appendChild(h("p", { text: "Swish-uppgifter kommer inom kort. Vi hör av oss i lagets WhatsApp-grupp." }));
    }

    content.appendChild(h("div", { class: "card done", style: "margin-top:16px" },
      h("p", { class: "okline", text: demo ? "Förhandsvisning (inget skickades)" : "Beställningen är mottagen" }),
      h("h2", { text: "Tack, " + p.barn + "!" }),
      h("div", { class: "sumrow" }, h("span", { class: "num", text: p.antal + " × " + CONFIG.produkt.namn }), h("span", { class: "num", text: kr(belopp) })),
      swish,
      h("p", { class: "small", style: "margin:14px 0 0", text: "Ordernummer: " + orderId + ". Ta gärna en skärmdump." }),
      h("p", { class: "small", text: "Din beställning räknas som klar när betalningen har kommit in." }),
      h("p", { text: CONFIG.utlamning }),
      h("p", { class: "small", text: CONFIG.aterbetalning }),
      h("p", { class: "small", text: CONFIG.kontakt }),
      h("button", { type: "button", class: "ghost", text: "Gör en ny beställning",
        onclick: function () { state.antal = 0; state.barn = ""; renderForm(); window.scrollTo(0, 0); } })));
    window.scrollTo(0, 0);
  }

  /* ---------- Flikar och vanliga frågor ---------- */
  var tabB = document.getElementById("tab-bestall"), tabF = document.getElementById("tab-fragor");
  var viewB = document.getElementById("view-bestall"), viewF = document.getElementById("view-fragor");
  function showTab(which) {
    var order = which !== "fragor";
    tabB.setAttribute("aria-selected", String(order)); tabF.setAttribute("aria-selected", String(!order));
    viewB.hidden = !order; viewF.hidden = order;
    try { history.replaceState(null, "", location.search + (order ? "" : "#fragor")); } catch (e) {}
    window.scrollTo(0, 0);
  }
  tabB.addEventListener("click", function () { showTab("bestall"); });
  tabF.addEventListener("click", function () { showTab("fragor"); });

  function renderFaq() {
    viewF.textContent = "";
    viewF.appendChild(h("h2", { class: "title", text: "Vanliga frågor" }));
    var c = h("div", { class: "card", style: "margin-top:16px" });
    CONFIG.faq.forEach(function (it) { c.appendChild(h("details", null, h("summary", { text: fill(it.f) }), h("p", { text: fill(it.s) }))); });
    viewF.appendChild(c);
    viewF.appendChild(h("p", { class: "small", style: "margin-top:12px", text: CONFIG.kontakt }));
  }

  renderFaq();
  renderForm();
  loadStatus();
  if (location.hash === "#fragor") showTab("fragor");
})();
</script>
</body>
</html>
